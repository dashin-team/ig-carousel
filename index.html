<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IG 輪播圖生成器</title>
<style>
:root{--fs:1;--f:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--f);background:#15151a;color:#eee}
header{padding:14px 18px;background:#0c0c10;border-bottom:1px solid #333}header h1{margin:0;font-size:20px}
.wrap{display:flex;gap:18px;padding:16px;flex-wrap:wrap}.panel{flex:1 1 340px;max-width:460px}.out{flex:3 1 500px}
textarea{width:100%;height:320px;background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:10px;font:14px/1.6 var(--f)}
label{display:block;margin:10px 0 4px;font-size:14px;color:#bbb}input[type=text],select{width:100%;padding:8px;background:#222;color:#eee;border:1px solid #444;border-radius:6px;font-family:var(--f)}
button{font-family:var(--f);background:linear-gradient(90deg,#ff3b3b,#ff5fa2);color:#fff;border:0;border-radius:8px;padding:10px 14px;margin:6px 4px 0 0;cursor:pointer;font-size:14px}
button.g{background:#333}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:flex;flex-wrap:wrap;gap:16px}.card{background:#1e1e24;padding:8px;border-radius:10px}
.holder{width:324px;height:405px;overflow:hidden;position:relative;border-radius:4px}.holder.over{outline:3px dashed #ff5fa2}
.holder>.slide{transform:scale(.3);transform-origin:0 0;position:absolute;left:0;top:0}
.tools{max-width:324px;display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.tools button{padding:6px 8px;font-size:12px;margin:0}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--f);display:flex;flex-direction:column;justify-content:center;padding:110px 100px 150px}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center}.slide .ov{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.slide .c{position:relative;z-index:2}.slide .t{font-size:calc(67px*var(--fs,1));font-weight:900;line-height:1.25;margin:0 0 50px;word-break:break-word}
.slide .b{font-size:calc(37px*var(--fs,1));line-height:1.7;white-space:pre-wrap;word-break:break-word}.slide.cover .t{font-size:calc(88px*var(--fs,1))}.slide.cover .b{font-size:calc(42px*var(--fs,1));opacity:.85}
.slide .tag{font-size:calc(27px*var(--fs,1));letter-spacing:6px;margin-bottom:30px;opacity:.7}
.slide .ft{position:absolute;z-index:2;left:100px;right:100px;bottom:60px;display:flex;justify-content:space-between;font-size:calc(26px*var(--fs,1));opacity:.75}
.slide.cta .c{text-align:center}.slide.cta .t{font-size:calc(77px*var(--fs,1))}
[contenteditable]:focus{outline:2px dashed rgba(255,95,162,.7)}
.dark{background:#000;color:#fff}.dark .t{background:linear-gradient(90deg,#ff2d2d,#ff6fb5);-webkit-background-clip:text;background-clip:text;color:transparent}
.warm{background:#f7efe3;color:#4a3a2c}.warm .t{color:#c0532b}.warm .tag{color:#c0532b}
.navy{background:#0f1f3d;color:#eef2fa}.navy .t{color:#d4af37}.navy .c{border-left:10px solid #d4af37;padding-left:50px}.navy.cta .c{border:0;padding:0}
.mini{background:#fff;color:#222}.mini .t{color:#111;border-bottom:6px solid #111;padding-bottom:30px}
.has-bg{color:#fff!important}.has-bg .t,.has-bg .tag{color:#fff!important;-webkit-text-fill-color:#fff}.has-bg.dark .t{color:#ff6f9a!important;-webkit-text-fill-color:#ff6f9a}.has-bg .c{border-color:#d4af37}
.tools .sl{display:flex;align-items:center;gap:4px;font-size:12px;color:#aaa;width:100%}.tools .sl input{flex:1}
#gal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:98}
.galbox{background:#1e1e24;border-radius:12px;padding:16px;max-width:560px;width:94vw}.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gg div{cursor:pointer;text-align:center;font-size:12px}.gg img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:3px solid transparent}.gg div:hover img{border-color:#ff5fa2}
#ig{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99}
.phone{width:min(360px,92vw);background:#fff;color:#111;border-radius:36px;padding:14px;border:8px solid #222}
.igh{display:flex;align-items:center;gap:8px;padding:6px;font-size:14px;font-weight:700}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.vp{position:relative;overflow:hidden;aspect-ratio:4/5;width:100%;touch-action:pan-y}.strip{display:flex;height:100%;transition:transform .3s}
.strip img{width:100%;height:100%;flex:0 0 100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);color:#000;border-radius:50%;width:30px;height:30px;padding:0;margin:0}
.dots{text-align:center;padding:8px}.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ccc;margin:0 2px}.dots i.on{background:#0095f6}
#exp{position:fixed;left:-99999px;top:0}
#msg{font-size:13px;color:#ff8fbf;min-height:18px;margin-top:6px}
.list{--sg:#9BC59D;--gd:#D9B76A;--tx:#f4f2ea;--tx2:#dfe3da;font-family:'Noto Serif TC','Noto Serif CJK TC','Songti TC','PMingLiU',serif;background:#1f2a26;color:var(--tx2);justify-content:center;padding:120px 96px 150px}
.list .ov{background:rgba(24,34,30,.8)}
.list .t{font-weight:900;color:var(--tx);letter-spacing:2px}
.list .gd{color:var(--gd)}
.list .ft{font-family:inherit;color:var(--sg);opacity:.9;letter-spacing:3px}
.list .ltag{display:inline-block;border:2px solid var(--sg);color:var(--sg);font-size:calc(24px*var(--fs,1));letter-spacing:12px;padding:10px 26px;margin-bottom:40px;font-weight:700}
.list .qm{font-size:calc(208px*var(--fs,1));line-height:.8;color:var(--sg);font-weight:900;height:150px}
.list.lcover .t{font-size:calc(80px*var(--fs,1));line-height:1.3;margin:0 0 50px}
.list .vbar{border-left:12px solid var(--sg);padding-left:36px;font-size:calc(37px*var(--fs,1));line-height:1.6;color:var(--tx2)}
.list .lt{font-size:calc(62px*var(--fs,1));line-height:1.3;margin-bottom:50px}
.list .callout{border:4px solid var(--sg);padding:50px 54px;font-size:calc(37px*var(--fs,1));line-height:1.75;background:var(--cb,rgba(255,255,255,.05));white-space:pre-wrap}
.list .item{display:flex;gap:40px;margin-bottom:64px}.list .item:last-child{margin-bottom:0}
.list .num{font-size:calc(136px*var(--fs,1));line-height:.85;color:var(--sg);font-weight:900;min-width:150px;text-align:center}
.list .ih{font-size:calc(46px*var(--fs,1));font-weight:900;line-height:1.3;margin-bottom:16px;color:var(--tx)}
.list .id{font-size:calc(30px*var(--fs,1));line-height:1.6;color:var(--tx2);margin-bottom:22px}
.list .qb{border:3px solid var(--sg);padding:20px 28px;font-size:calc(29px*var(--fs,1));line-height:1.5;color:var(--sg)}
.list .qb b{color:var(--gd)}
.list.lessay .t{font-size:calc(61px*var(--fs,1));padding-bottom:30px;border-bottom:4px solid var(--gd);display:inline-block}
.list .es{font-size:calc(37px*var(--fs,1));line-height:1.9;white-space:pre-wrap;margin-top:50px}
.list.lclose .c{text-align:center}.list .dv{width:180px;height:3px;background:var(--gd);margin:60px auto}
.list.lclose .t{font-size:calc(70px*var(--fs,1));line-height:1.45;margin:0}
.list .sl2{font-size:calc(38px*var(--fs,1));line-height:2;margin-bottom:50px}.list .sl2 div:before{content:'✓ ';color:var(--sg);font-weight:900}
.list .cta{border:4px solid var(--gd);padding:40px 46px;font-size:calc(35px*var(--fs,1));line-height:1.6;text-align:center;color:var(--tx)}
.list.milk,.list.bold{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif}
.milk .c{background:var(--card);border-radius:56px;padding:76px 70px;border:4px solid var(--cb)}
.milk .qm{display:none}.milk .ltag{border:0;background:var(--cb);color:var(--tx);border-radius:999px;letter-spacing:4px;font-size:calc(26px*var(--fs,1));padding:12px 34px}
.milk .t{letter-spacing:1px;font-weight:900}.milk.lcover .t{font-size:calc(74px*var(--fs,1))}.milk .vbar{border:0;padding:0;font-size:calc(35px*var(--fs,1))}
.milk .callout,.milk .qb,.milk .cta{border-radius:28px;border:0;background:var(--cb)}.milk .qb{color:var(--tx)}
.milk .num{width:118px;min-width:118px;height:118px;border-radius:50%;background:var(--sg);color:#fff;font-size:calc(43px*var(--fs,1));line-height:118px;font-weight:900}
.milk .item{gap:34px;margin-bottom:48px}.milk .ih{font-size:calc(42px*var(--fs,1))}.milk .id{font-size:calc(29px*var(--fs,1))}.milk.lessay .t{border-bottom:0;background:var(--cb);border-radius:20px;padding:10px 26px}
.milk .dv{height:10px;width:120px;border-radius:9px;background:var(--cb)}.milk.lclose .t{font-size:calc(64px*var(--fs,1))}.milk .sl2 div:before{content:'♡ ';color:var(--sg)}
.edit{padding:150px 120px 170px}.edit .t{font-weight:700;letter-spacing:4px}.edit .qm{display:none}
.edit .ltag{border:0;border-bottom:2px solid var(--sg);padding:0 0 14px;font-size:calc(21px*var(--fs,1));letter-spacing:14px;font-weight:400}
.edit.lcover .t{font-size:calc(77px*var(--fs,1));line-height:1.35}.edit .vbar{border-left:2px solid var(--sg);padding-left:32px;font-size:calc(32px*var(--fs,1))}
.edit .vbar,.edit .callout,.edit .id,.edit .es,.edit .sl2,.edit .cta{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-weight:300}
.edit .lt{font-size:calc(54px*var(--fs,1))}.edit .callout{border:0;border-top:2px solid var(--sg);border-bottom:2px solid var(--sg);padding:46px 0;background:none;font-size:calc(34px*var(--fs,1))}
.edit .num{font-size:calc(88px*var(--fs,1));font-weight:300;min-width:130px;border-right:1px solid var(--tx2);padding-right:30px}
.edit .item{gap:40px;margin-bottom:70px}.edit .ih{font-size:calc(40px*var(--fs,1));font-weight:700}.edit .id{font-size:calc(28px*var(--fs,1))}.edit .qb{border:1px solid var(--sg);font-size:calc(26px*var(--fs,1))}
.edit.lessay .t{font-size:calc(53px*var(--fs,1));border-bottom:1px solid var(--sg)}.edit .es{font-size:calc(34px*var(--fs,1))}.edit .dv{height:1px;width:240px;background:var(--sg)}
.edit.lclose .t{font-size:calc(62px*var(--fs,1));font-weight:700}.edit .cta{border:1px solid var(--sg);font-size:calc(32px*var(--fs,1))}.edit .sl2{font-size:calc(35px*var(--fs,1))}
.bold .t{font-weight:900;letter-spacing:0}.bold .qm{display:none}
.bold .ltag{background:var(--sg);color:var(--bgc);border:0;font-weight:900;letter-spacing:6px;font-size:calc(27px*var(--fs,1))}
.bold.lcover .t{font-size:calc(112px*var(--fs,1));line-height:1.15}.bold .vbar{border-left:16px solid var(--sg);font-size:calc(38px*var(--fs,1));font-weight:700}
.bold .lt{font-size:calc(75px*var(--fs,1))}.bold .callout{border-width:6px;font-size:calc(36px*var(--fs,1));font-weight:700}
.bold .num{font-size:calc(150px*var(--fs,1));letter-spacing:-8px}.bold .ih{font-size:calc(48px*var(--fs,1))}.bold .id{font-size:calc(28px*var(--fs,1));font-weight:500}.bold .qb{border-width:5px;font-size:calc(28px*var(--fs,1));font-weight:700}
.bold.lessay .t{font-size:calc(78px*var(--fs,1));border-bottom:10px solid var(--gd)}.bold .es{font-size:calc(36px*var(--fs,1));font-weight:500}
.bold.lclose .t{font-size:calc(90px*var(--fs,1));line-height:1.3}.bold .dv{height:12px;width:200px}.bold .cta{border-width:6px;font-weight:900;font-size:calc(34px*var(--fs,1))}.bold .sl2{font-size:calc(40px*var(--fs,1));font-weight:700}
.gpt{margin-top:14px;background:#1e1e24;border-radius:10px;padding:8px 12px}.gpt summary{cursor:pointer;font-weight:700;padding:4px 0}
.gp{margin:10px 0;border-top:1px solid #333;padding-top:8px}.gp b{font-size:14px}.gp pre{white-space:pre-wrap;font:12px/1.6 var(--f);background:#15151a;padding:8px;border-radius:6px;max-height:140px;overflow:auto;color:#ccc}.gp button{padding:6px 10px;font-size:12px}</style></head><body>
<header><h1>📸 IG 輪播圖生成器</h1></header>
<div class="wrap"><div class="panel">
<label>貼上 AI 文案（空行或「1.」「第1張」「---」分隔；每段第一行為標題）</label>
<textarea id="src"></textarea>
<label>模板</label><select id="tpl"><option value="dark">暗黑模式（紅粉漸層）</option><option value="warm">溫暖淺色</option><option value="navy">海軍藍金（保險專業）</option><option value="mini">極簡白</option><option value="milk">奶茶溫馨風</option><option value="edit">簡約質感風</option><option value="bold">高對比亮眼風</option></select>
<div id="varRow" style="display:none"><label>樣式變化</label><select id="variant"></select></div><div id="schemeRow"><label>配色（綠金清單）</label><select id="scheme"><option value="0">灰綠配金</option><option value="1">深藍配金</option><option value="2">酒紅配米</option><option value="3">墨黑配橘</option><option value="4">咖啡配奶茶</option><option value="5">紫配粉</option><option value="c">自訂…</option></select>
<div id="custom" class="row" style="display:none;font-size:13px;color:#bbb;margin-top:6px">主色 <input type="color" id="cAcc" value="#9BC59D"> 強調色 <input type="color" id="cHl" value="#D9B76A"></div></div>
<label>字體大小 <span id="fsv">100%</span></label><input type="range" id="fs" min="0.7" max="1.3" step="0.05" value="1" style="width:100%">
<label>頁尾帳號</label><input type="text" id="handle" value="梁仕翰｜富邦人壽">
<label><input type="checkbox" id="pg" checked> 顯示頁碼</label>
<div class="row"><button id="gen">✨ 生成輪播圖</button><button class="g" id="igbtn">📱 IG預覽</button><button class="g" id="zip">⬇ 全部下載 ZIP</button><button class="g" id="ldtpl">📝 載入文字範本</button><button class="g" id="ldlist">📋 範例：買保險前先問八個問題</button></div>
<div id="msg"></div>
<details class="gpt" id="gpt"><summary>🤖 GPT 指令（複製貼到 ChatGPT）</summary><div id="gpl"></div></details>
<p style="font-size:12px;color:#888">提示：點投影片文字可直接編輯；可拖曳圖片到投影片當背景。</p>
</div><div class="out"><div class="grid" id="grid"></div></div></div>
<div id="ig"><div><div class="phone"><div class="igh"><span class="av"></span><span id="igname"></span></div>
<div class="vp" id="vp"><div class="strip" id="strip"></div><button class="ar" id="pv" style="left:6px">‹</button><button class="ar" id="nx" style="right:6px">›</button></div>
<div class="dots" id="dots"></div><div style="font-size:13px;padding:0 6px 8px">♡ 💬 ➤</div></div>
<div style="text-align:center"><button class="g" id="igclose">關閉</button></div></div></div>
<div id="gal"><div class="galbox"><b>內建背景圖庫</b>（Unsplash 免費商用）<div class="gg" id="gg"></div>
<label><input type="checkbox" id="galall"> 套用到全部投影片</label><button class="g" id="galclose">取消</button></div></div><div id="exp"></div>

const $=s=>document.querySelector(s);
const SAMPLE=`第1張 30歲前一定要懂的保險觀念
別等到需要時才後悔，這7件事先搞懂

第2張 保險不是投資
保險的核心是「轉嫁風險」。
先把保障做足，再談理財報酬。

第3張 先保大人，再保小孩
家庭經濟支柱倒下，影響最大。
孩子最好的保障，是健康有收入的父母。

第4張 醫療險要看實支實付
健保不給付的自費項目越來越多，
實支實付能補上這個缺口。

第5張 重大傷病不能少
一次給付的保險金，
讓你安心治療、不必急著回去上班。

第6張 保額比保單數量重要
買10張小保單，不如1張保額足夠的。
定期檢視保障缺口才是關鍵。

第7張 想知道你的保障夠不夠？

function parse(txt){
  txt=txt.replace(/\r/g,'').trim();if(!txt)return[];
  const mk=/^\s*(?:第\s*\d+\s*[張页頁]|\d+\s*[.、．)]|-{3,}|slide\s*\d+)\s*[:：]?\s*/i;
  let blocks=[],cur=[];
  for(const line of txt.split('\n')){
    if(!line.trim()){if(cur.length){blocks.push(cur);cur=[]}continue}
    if(mk.test(line)){if(cur.length)blocks.push(cur);cur=[];const r=line.replace(mk,'').trim();if(r)cur.push(r);continue}
    cur.push(line.trim());
  }
  if(cur.length)blocks.push(cur);
  blocks=blocks.filter(b=>b.length);
  if(blocks.length===1){
    const s=blocks[0].join('').match(/[^。！？!?；;]+[。！？!?；;]?/g)||[];
    if(s.length<=2){blocks=[[s[0]||'',s.slice(1).join('')]];}
    else{const chunks=[[s[0].replace(/[。！？!?]$/,''),'']];const rest=s.slice(1),k=Math.max(1,Math.ceil(rest.length/6));
      for(let i=0;i<rest.length;i+=k){const g=rest.slice(i,i+k);chunks.push([g[0].replace(/[。；;]$/,''),g.slice(1).join('\n')])}
      blocks=chunks;}
  }
  return blocks.map(b=>({t:b[0],b:b.slice(1).join('\n'),img:null,dark:.55}));
}

  <div class="c">${kind==='cover'?'<div class="tag">SWIPE ➜</div>':''}<div class="t" contenteditable data-k="t">${esc(s.t)}</div><div class="b" contenteditable data-k="b">${esc(s.b)}</div></div>
  <div class="ft"><span>${esc($('#handle').value)}</span><span>${$('#pg').checked?(i+1)+' / '+n:''}</span></div></div>`;
}
function render(){
  const g=$('#grid');g.innerHTML='';
  slides.forEach((s,i)=>{
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<div class="holder">${slideHTML(s,i,slides.length)}</div><div class="tools">
    <button class="g up">🖼 更換背景</button><button class="g gl">🏢 圖庫</button><button class="g all">📋 套用到全部</button><button class="g rm">✕ 移除背景</button><button class="dl">⬇ PNG</button>
    <label class="sl">遮罩深淺<input type="range" min="0" max="0.9" step="0.05" value="${s.dark}"><span>${Math.round(s.dark*100)}%</span></label><input type="file" accept="image/*" hidden></div>`;
    const rg=card.querySelector('input[type=range]');rg.oninput=()=>{s.dark=+rg.value;rg.nextElementSibling.textContent=Math.round(s.dark*100)+'%';const o=h.querySelector('.ov');if(o)o.style.background=`rgba(0,0,0,${s.dark})`};
    card.querySelector('.gl').onclick=()=>{galTarget=i;$('#galall').checked=false;$('#gal').style.display='flex'};
    card.querySelector('.all').onclick=()=>{slides.forEach(x=>{x.img=s.img;x.dark=s.dark});render();msg(s.img?'已將此背景套用到全部':'已移除全部背景')};
    const h=card.querySelector('.holder'),f=card.querySelector('input[type=file]');
    h.querySelectorAll('[contenteditable]').forEach(el=>el.addEventListener('input',()=>{s[el.dataset.k]=el.innerText}));
    card.querySelector('.up').onclick=()=>f.click();
    f.onchange=()=>f.files[0]&&setImg(i,f.files[0]);
    card.querySelector('.rm').onclick=()=>{s.img=null;s.noAuto=true;render()};
    card.querySelector('.dl').onclick=async()=>{const c=await snap(i);dlBlob(await toBlob(c),`slide-${i+1}.png`)};
    h.ondragover=e=>{e.preventDefault();h.classList.add('over')};h.ondragleave=()=>h.classList.remove('over');
    h.ondrop=e=>{e.preventDefault();h.classList.remove('over');const fl=e.dataTransfer.files[0];if(fl&&fl.type.startsWith('image/'))setImg(i,fl)};
    g.appendChild(card);
  });
}
function setImg(i,file){const r=new FileReader();r.onload=()=>{slides[i].img=r.result;render()};r.readAsDataURL(file)}
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
async function snap(i){
  if(document.fonts)await document.fonts.ready;
  if(['list','milk','edit','bold'].includes($('#tpl').value)){const u=listImg(slides[i],i);if(u)await ensureGray(u)}
  const box=$('#exp');box.innerHTML=slideHTML(slides[i],i,slides.length);
  const el=box.firstElementChild;
  if(el.classList.contains('dark')){ // html2canvas 不支援 background-clip:text → 逐字漸層
    const t=el.querySelector('.t'),chars=[...t.textContent];t.style.background='none';t.style.color='#ff2d2d';
    t.innerHTML=chars.map((ch,k)=>{const r=chars.length>1?k/(chars.length-1):0;return `<span style="color:rgb(255,${lerp(45,111,r)},${lerp(45,181,r)})">${esc(ch)}</span>`}).join('');
  }
  const c=await html2canvas(el,{width:1080,height:1350,scale:1,backgroundColor:null,useCORS:true,logging:false});
  box.innerHTML='';return c;
}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
function dlBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
